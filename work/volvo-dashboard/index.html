  <script>
    const form = document.getElementById('unlock-form');
    const input = document.getElementById('password');
    const button = document.getElementById('unlock-button');
    const message = document.getElementById('message');
    const payload = JSON.parse(document.getElementById('encrypted-page').textContent);

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), char => char.charCodeAt(0));
    }

    async function unlockPage(password) {
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: decodeBase64(payload.salt), iterations: payload.iterations },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: decodeBase64(payload.iv) }, key, decodeBase64(payload.ciphertext)
      );
      return new TextDecoder().decode(decrypted);
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!globalThis.crypto?.subtle) {
        message.textContent = 'Please open the HTTPS version of this site in an up-to-date browser.';
        return;
      }
      button.disabled = true;
      button.textContent = 'Unlocking…';
      message.textContent = '';
      input.removeAttribute('aria-invalid');
      try {
        const html = await unlockPage(input.value);
        input.value = '';
        // Restore the original complete page at the same URL; its relative links stay valid.
        document.open();
        document.write(html);
        document.close();
      } catch {
        message.textContent = 'That password did not unlock the page. Please try again.';
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        input.select();
        button.disabled = false;
        button.textContent = 'View case study';
      }
    });
  </script>
